<!DOCTYPE html>
<html lang="nl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>De Mol Project 12</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { molDark: '#0b131f', molCard: '#131f33', molAccent: '#00f2fe', molGreen: '#10b981', molRed: '#ef4444' } } }
        }
    </script>
</head>
<body class="bg-molDark text-slate-100 min-h-screen font-sans">

    <nav class="bg-molCard border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <span class="text-xl font-black bg-gradient-to-r from-molAccent to-teal-400 bg-clip-text text-transparent">DE MOL PROJECT 12</span>
                <div class="flex space-x-6 text-sm">
                    <button onclick="switchTab('dashboard')" class="text-molAccent">Dashboard</button>
                    <button onclick="switchTab('opdracht')" class="hover:text-molAccent">Opdracht</button>
                    <button onclick="switchTab('kandidaten')" class="hover:text-molAccent">Kandidaten</button>
                </div>
                <div class="bg-slate-900 px-3 py-1 rounded-lg border border-slate-700 text-amber-400 font-bold" id="pot-display">€ 2,50</div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <section id="tab-dashboard" class="tab-content">
            <h1 class="text-3xl font-black mb-6">Het Spelbord</h1>
            <img src="visuele opdracht.jpg" alt="Visuele Opdracht" class="w-full rounded-2xl border border-slate-700 shadow-2xl">
        </section>

        <section id="tab-opdracht" class="tab-content hidden">
            <h2 class="text-2xl font-bold mb-6">Instructievideo</h2>
            <div class="aspect-video w-full max-w-2xl">
                <iframe class="w-full h-full rounded-xl border border-slate-700" src="https://www.youtube.com/embed/2NrbyqxjaeM" allowfullscreen></iframe>
            </div>
        </section>

        <section id="tab-kandidaten" class="tab-content hidden">
            <h2 class="text-2xl font-bold mb-6">Kandidaten</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                <div class="bg-molCard p-4 rounded-xl border border-slate-800"><div class="aspect-video"><iframe class="w-full h-full rounded" src="https://www.youtube.com/embed/KANDIDAAT1_ID"></iframe></div><p class="mt-2 text-center">Kandidaat 1</p></div>
                <div class="bg-molCard p-4 rounded-xl border border-slate-800"><div class="aspect-video"><iframe class="w-full h-full rounded" src="https://www.youtube.com/embed/KANDIDAAT2_ID"></iframe></div><p class="mt-2 text-center">Kandidaat 2</p></div>
                <div class="bg-molCard p-4 rounded-xl border border-slate-800"><div class="aspect-video"><iframe class="w-full h-full rounded" src="https://www.youtube.com/embed/KANDIDAAT3_ID"></iframe></div><p class="mt-2 text-center">Kandidaat 3</p></div>
                <div class="bg-molCard p-4 rounded-xl border border-slate-800"><div class="aspect-video"><iframe class="w-full h-full rounded" src="https://www.youtube.com/embed/KANDIDAAT4_ID"></iframe></div><p class="mt-2 text-center">Kandidaat 4</p></div>
                <div class="bg-molCard p-4 rounded-xl border border-slate-800"><div class="aspect-video"><iframe class="w-full h-full rounded" src="https://www.youtube.com/embed/KANDIDAAT5_ID"></iframe></div><p class="mt-2 text-center">Kandidaat 5</p></div>
            </div>
        </section>
    </main>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tabId).classList.remove('hidden');
        }
    </script>
</body>
</html>
